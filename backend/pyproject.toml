[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transit2fog-backend"
version = "0.1.0"
description = "Local-first API and geometry engine for Transit2Fog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.4,<2",
  "fastapi>=0.116.1,<1",
  "geopandas>=1.1.1,<2",
  "lxml>=6.0.1,<7",
  "networkx>=3.4.2,<4",
  "osmium>=4.3.1,<5",
  "platformdirs>=4.3.8,<5",
  "pydantic-settings>=2.10.1,<3",
  "pypinyin>=0.55.0,<1",
  "pyogrio>=0.11.1,<1",
  "pyproj>=3.7.2,<4",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.13.0,<4",
  "shapely>=2.1.1,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "lxml-stubs>=0.5.1,<1",
  "pandas-stubs>=2.3.2,<3",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.8,<1",
  "types-geopandas>=1.1.1,<2",
  "types-shapely>=2.1.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/exports/gpx.xsd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
