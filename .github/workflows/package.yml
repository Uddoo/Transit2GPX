name: Install packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact release tag (leave empty for an unpublished preview build)'
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.26
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          uv sync --project backend --dev --frozen
          npm ci --prefix frontend
      - name: Build pinned sidecar on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\transit2gpx.ps1 rail-bootstrap
      - name: Build pinned sidecar on macOS
        if: runner.os == 'macOS'
        run: make rail-bootstrap
      - name: Build Windows install package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = .\scripts\setup_inno.ps1 -Destination "$env:RUNNER_TEMP\transit2gpx-inno"
          $releaseTag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "preview-$env:GITHUB_SHA" }
          uv run --project backend python scripts/build_package.py `
            --sidecar-jar data/rail-routing/dist/openrailrouting.jar `
            --rail-components --release-tag $releaseTag --windows-installer --iscc $iscc
      - name: Build macOS install package
        if: runner.os == 'macOS'
        run: |
          release_tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if [ -z "$RELEASE_TAG" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then release_tag="preview-${GITHUB_SHA}"; fi
          uv run --project backend python scripts/build_package.py \
            --sidecar-jar data/rail-routing/dist/openrailrouting.jar \
            --rail-components --release-tag "$release_tag"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transit2gpx-${{ runner.os }}
          path: release/packages/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged packages
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify the exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            test "$existing_sha" = "$GITHUB_SHA" || { echo 'Refusing to move an existing release tag'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: transit2gpx-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release-assets/*
